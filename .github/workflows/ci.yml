name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A stale bundle is the one failure the tests cannot see, because the
      # pretest step rebuilds it. Build first, then fail if the checked-in
      # bundle changed.
      - run: npm run build
      - name: Check the bundle is current
        run: git diff --exit-code -- service/main.js

      - run: npm run verify
      - run: npm run zip

      - uses: actions/upload-artifact@v7
        with:
          name: openchamber-jira-zip
          path: openchamber-jira.zip
          if-no-files-found: error
          retention-days: 14
