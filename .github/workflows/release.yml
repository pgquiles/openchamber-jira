name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
      - name: Check the bundle is current
        run: git diff --exit-code -- service/main.js

      - run: npm run verify
      - run: npm run zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" openchamber-jira.zip \
            --verify-tag \
            --generate-notes \
            --title "OpenChamber Jira ${GITHUB_REF_NAME#v}"
